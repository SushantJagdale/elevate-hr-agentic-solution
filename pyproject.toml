[project]
name = "enterprise-hr-agentic-assistant"
version = "2.1.0"
description = "Enterprise HR Agentic Virtual Assistant (MVP 1) built with Google ADK, Gemini, and GCP-native Serverless Architecture"
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
