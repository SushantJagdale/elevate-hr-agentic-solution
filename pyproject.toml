[project]
name = "hr-agentic-solution"
version = "0.1.0"
description = "Enterprise HR Agentic Virtual Assistant (MVP 1)"
readme = "Consolidated_SDD.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
